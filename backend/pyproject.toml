[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pillow>=11.0",
    # 向量库为自建实现（JSON + .npy + numpy 余弦），不再依赖 chromadb：
    # chroma 1.5.x 在 Windows + Python 3.14 下 HNSW 索引不落盘，新进程查询必失败
    "numpy>=1.26",
    "transformers>=4.44",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "modelscope>=1.15",
    # MCP Server（backend/mcp_server.py）：景点检索/天气暴露给 Claude Desktop 等 MCP 客户端
    "fastmcp>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
